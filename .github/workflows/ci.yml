name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]   # one version per OS to conserve private-repo CI minutes
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install pytest-cov
          pytest -q --cov=agentgate --cov-report=term --cov-fail-under=60
